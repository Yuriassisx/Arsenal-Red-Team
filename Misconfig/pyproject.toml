[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "misconfig"
version = "1.0.0"
description = "Scanner agressivo de misconfigurations, dados sensiveis expostos, information disclosure, falhas de API (OWASP API Top 10), fingerprint de tecnologias/CVEs e recon."
readme = "README.md"
requires-python = ">=3.7"
license = { text = "MIT" }
keywords = ["security", "pentest", "bugbounty", "scanner", "recon", "owasp", "misconfiguration", "api-security"]
authors = [{ name = "Yonkou" }]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

# Apenas 'requests' e obrigatorio. dnspython/cryptography sao opcionais (extra "full").
dependencies = [
    "requests>=2.25",
]

[project.optional-dependencies]
full = [
    "dnspython>=2.1",     # recon de DNS: CNAME/SPF/DMARC/AXFR/subdominios/takeover
    "cryptography>=3.4",  # analise de certificado TLS: validade/self-signed/SAN
]

[project.urls]
Homepage = "https://github.com/"

# Instala o comando de terminal:  misconfig  ->  chama misconfig.main()
[project.scripts]
misconfig = "misconfig:main"

# Layout flat: um unico modulo (misconfig.py)
[tool.setuptools]
py-modules = ["misconfig"]
